# grafana 10.5.14 (app 12.3.1)
image:
  tag: 12.3.1
  sha: 2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f

# No adminPassword here. The chart generates a random one and keeps it in the
# `grafana` Secret (key admin-password); upgrades reuse it via lookup.
replicas: 1

# RWO PVC with sqlite: never two pods at once.
deploymentStrategy:
  type: Recreate

resources:
  requests: { cpu: 50m, memory: 192Mi }
  limits: { memory: 512Mi }

downloadDashboardsImage:
  tag: 8.15.0
  sha: 4026b29997dc7c823b51c164b71e2b51e0fd95cce4601f78202c513d97da2922
downloadDashboards:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi
  accessModes: ["ReadWriteOnce"]

service:
  type: ClusterIP

initChownData:
  enabled: false # the local-path PV is 0777; the pod runs as uid 472

testFramework:
  enabled: false

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  server:
    # Access only through `kubectl port-forward svc/grafana 3000:80`.
    root_url: http://localhost:3000

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics.monitoring.svc:8428
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/default

# Downloaded from grafana.com at pod start (init container).
dashboards:
  default:
    node-exporter-full:
      gnetId: 1860
      revision: 45
      datasource: VictoriaMetrics
    k8s-views-pods:
      gnetId: 15760
      revision: 41
      datasource: VictoriaMetrics
