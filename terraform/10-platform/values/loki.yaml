# loki 7.3.0 (app 3.6.12), monolithic mode (SingleBinary), local disk.
deploymentMode: SingleBinary

loki:
  image:
    tag: 3.6.12
    digest: sha256:2483b71b28b15dee230f85512cae2b20c4b5f6e98a6eabe686cbccfa5ea3ba4a
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    # 30 days by default; a longer period for a specific stream can be set with
    # retention_stream, e.g. selector '{container="edge-proxy"}' for access logs.
    retention_period: 720h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  compactor:
    working_directory: /var/loki/retention
    retention_enabled: true
    delete_request_store: filesystem
  # No telemetry to the vendor.
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi
    # Deleting the release does not delete the PVC.
    enableStatefulSetAutoDeletePVC: false
    whenDeleted: Retain
    whenScaled: Retain

# Everything that only exists in the scalable modes, off.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
sidecar:
  rules:
    enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
